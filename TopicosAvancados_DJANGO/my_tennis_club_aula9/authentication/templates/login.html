{% extends 'master.html' %}

{% block title %}
- Acesso
{% endblock %}

{% block content %}

<div class="card mt-2">
    <div class="card-header">
        Acesso
    </div>
    <div class="card-body">

        <form action="/login/" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            Usuário: <br>
            <input name="username">
            <br><br>
            Senha: <br>
            <input name="password" type="password">
            <br><br>
            <input type="submit" value="Submit">
        </form>

        <br>
        <p>Não tem conta? <a href="/register/">Registre-se</a></p>

    </div>
</div>

{% endblock %}
