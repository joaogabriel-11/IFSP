{% extends 'master.html' %}

{% block title %}
- Alterar senha
{% endblock %}

{% block content %}

<div class="card mt-2">
    <div class="card-header">
        Alterar senha
    </div>
    <div class="card-body">

        <form action="/change_password/" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            Senha atual: <br>
            <input name="actual_password" type="password" required>
            <br><br>
            Senha nova: <br>
            <input name="new_password" type="password" required>
            <br><br>
            Repita a Senha nova: <br>
            <input name="repeated_password" type="password" required>
            <br><br>
            <input type="submit" value="Submit">
        </form>

        <br>
        <p>Não tem conta? <a href="/register/">Registre-se</a></p>

    </div>
</div>

{% endblock %}
